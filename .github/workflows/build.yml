name: Build Android APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Web Manifest and Build APK
        run: |
          cat <<EOF > www/manifest.json
          {
            "name": "Memory Blocks Game",
            "short_name": "MemoryBlocks",
            "start_url": "index.html",
            "display": "fullscreen",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "orientation": "any"
          }
          EOF
          
          sed -i '/<\/head>/i <link rel="manifest" href="manifest.json">' www/index.html
          
          bubblewrap init --manifest=www/manifest.json --meta-out=android-metadata --directory=www
          
          bubblewrap build --password="password123" --keypassword="password123"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Fullscreen-Game-APK
          path: app-release-signed.apk