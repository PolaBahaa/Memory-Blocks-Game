name: Build Android APK
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clean Local System Files
        run: |
          # Remove local node modules to prevent operating system conflicts
          rm -rf node_modules package-lock.json

      - name: Fresh Installation of Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Sync Web Assets to Android Folder
        run: |
          npx cap sync android

      - name: Build Android Package with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace